services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=restaurant
      - POSTGRES_USER=restaurant
      - POSTGRES_PASSWORD=restaurant
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant-network

  # Kafka – the backend publishes order events to the "order-events" topic;
  # the notification service consumes them and broadcasts to the frontend
  # over WebSocket.
  kafka:
    image: apache/kafka:3.7.0
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    ports:
      - "9092:9092"
    networks:
      - restaurant-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    # Stable hostname so the embedded H2 database can resolve it (AUTO_SERVER),
    # and --import-realm to provision the "restaurant" realm on first start.
    hostname: keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      # Host port 8090 (8080 is often taken by other local services);
      # containers reach Keycloak via http://keycloak:8080 inside the network.
      - "8090:8080"
    networks:
      - restaurant-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/restaurant
      - SPRING_DATASOURCE_DRIVERCLASSNAME=org.postgresql.Driver
      - SPRING_DATASOURCE_USERNAME=restaurant
      - SPRING_DATASOURCE_PASSWORD=restaurant
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    env_file:
      # Google OAuth credentials are kept OUTSIDE this repository.
      # Create ~/.config/restaurant/secrets.env with GOOGLE_CLIENT_ID /
      # GOOGLE_CLIENT_SECRET (see README). Optional: without it the backend
      # starts with placeholder credentials from application.properties.
      - path: ~/.config/restaurant/secrets.env
        required: false
    depends_on:
      - db
      - kafka
    networks:
      - restaurant-network

  # Intermediary service between backend and frontend. It consumes order
  # events from Kafka (published by the backend) and broadcasts them to the
  # frontend over WebSocket (STOMP).
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
      - backend
    networks:
      - restaurant-network

  # Angular SPA tier – serves the static bundle internally on port 4200.
  # Not exposed to the host; all traffic enters through the nginx proxy.
  angular:
    build:
      context: ./front
      dockerfile: Dockerfile.angular
    depends_on:
      - backend
    networks:
      - restaurant-network

  # Nginx edge/proxy tier – the single entry point exposed on :8082.
  # Serves nothing itself: forwards / to the Angular service and proxies
  # /api, /ws, /oauth2 to the backend and /keycloak to Keycloak.
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.nginx
    ports:
      - "8082:80"
    depends_on:
      - angular
      - backend
      - keycloak
      - notification-service
    networks:
      - restaurant-network

  # Angular unit tests (Karma/Jasmine) - runs headless Chrome inside the
  # same browser image as the E2E suite, so no local browser is required.
  frontend-unit-tests:
    image: cypress/browsers:latest
    working_dir: /e2e
    volumes:
      - ./front:/e2e
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
    command: sh -c "npm install --legacy-peer-deps && npx ng test --watch=false --karma-config=karma-ci.conf.js --browsers=ChromeHeadlessNoSandbox"


  # Same suite in Karma watch mode: re-runs affected tests on every file
  # change. Run interactively so Ctrl+C stops it cleanly:
  #   docker compose run --rm frontend-unit-tests-watch
  frontend-unit-tests-watch:
    image: cypress/browsers:latest
    working_dir: /e2e
    volumes:
      - ./front:/e2e
    environment:
      - CHROME_BIN=/usr/bin/google-chrome
    tty: true
    stdin_open: true
    # Karma server exposed so the interactive debug page can be opened on
    # the host while watch mode is running: http://localhost:9876/debug.html
    ports:
      - "9876:9876"
    command: sh -c "npm install --legacy-peer-deps && npx ng test --karma-config=karma-ci.conf.js --browsers=ChromeHeadlessNoSandbox"

  e2e-tests:
    image: cypress/browsers:latest
    working_dir: /e2e
    volumes:
      - ./front:/e2e
      - cypress_cache:/root/.cache/Cypress
    depends_on:
      - frontend
    networks:
      - restaurant-network
    ports:
      - "9222:9222"
    command: sh -c "npm install --legacy-peer-deps && npx cypress install && npx cypress run --browser chrome --config baseUrl=http://frontend:80"

  integration-tests:
    image: maven:3.9-eclipse-temurin-17-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Share the Maven repository between runs so dependencies are
      # downloaded only once instead of on every test execution.
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Let Testcontainers resolve mapped ports via the docker host gateway,
      # required because the JVM itself runs inside a container.
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    command: sh -c "./mvnw test"

  # Unit tests for the notification-service (Kafka consumer + WebSocket
  # broadcaster). Runs in a Maven container so no local JDK is required.
  # Depends on nothing: the tests are unit tests using Mockito.
  notification-service-tests:
    image: maven:3.9-eclipse-temurin-17-alpine
    working_dir: /app
    volumes:
      - ./notification-service:/app
      # Share the Maven repository between runs so dependencies are
      # downloaded only once instead of on every test execution.
      - maven_cache:/root/.m2
    command: sh -c "mvn test"

networks:
  restaurant-network:
    driver: bridge

volumes:
  postgres_data:
  cypress_cache:
  # Shared Maven repository cache for the integration-tests and
  # notification-service-tests containers – avoids re-downloading all
  # dependencies on every test run.
  maven_cache:
