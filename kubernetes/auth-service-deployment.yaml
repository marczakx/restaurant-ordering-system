apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: marczakx/auth:2
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://auth-db:5432/postgres
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: dbpas-change-it
        - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
          value: org.hibernate.dialect.PostgreSQLDialect
        - name: JWT_SECRET
          value: ++++++++++++++++++++++CHANGE+IT+++++++++++++++++++++++++++++++++