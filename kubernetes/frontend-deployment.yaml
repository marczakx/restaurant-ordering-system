# Nginx reverse-proxy tier (the frontend entry point).
#
# Pure proxy: forwards / to the Angular SPA service and proxies
# /api, /ws, /oauth2 to the backend and /keycloak to Keycloak.
# Keeps the "frontend" name/port contract used by the ingress,
# E2E job and LoadBalancer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-frontend
  namespace: restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-frontend
  template:
    metadata:
      labels:
        app: restaurant-frontend
    spec:
      containers:
      - name: frontend
        image: marczakx/restaurant-frontend:1.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 80