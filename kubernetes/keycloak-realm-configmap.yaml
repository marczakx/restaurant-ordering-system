# Keycloak realm configuration for the restaurant application.
# Mounted into the Keycloak pod at /opt/keycloak/data/import/ and imported
# automatically on startup via `start-dev --import-realm`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: restaurant
data:
  restaurant-realm.json: |
    {
      "realm": "restaurant",
      "enabled": true,
      "roles": {
        "realm": [
          {
            "name": "menu-editor",
            "description": "Can edit existing menu items"
          },
          {
            "name": "menu-creator",
            "description": "Can add new menu items"
          }
        ]
      },
      "clients": [
        {
          "clientId": "restaurant-client",
          "name": "Restaurant Frontend",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "redirectUris": ["*"],
          "webOrigins": ["*"],
          "defaultClientScopes": ["web-origins", "acr", "profile", "roles", "email"],
          "optionalClientScopes": ["address", "phone", "offline_access", "microprofile-jwt"]
        }
      ],
      "users": [
        {
          "username": "demo",
          "enabled": true,
          "email": "demo@restaurant.local",
          "emailVerified": true,
          "firstName": "Demo",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "demo",
              "temporary": false
            }
          ],
          "realmRoles": ["menu-editor", "menu-creator"]
        },
        {
          "username": "editor",
          "enabled": true,
          "email": "editor@restaurant.local",
          "emailVerified": true,
          "firstName": "Menu",
          "lastName": "Editor",
          "credentials": [
            {
              "type": "password",
              "value": "editor",
              "temporary": false
            }
          ],
          "realmRoles": ["menu-editor"]
        },
        {
          "username": "creator",
          "enabled": true,
          "email": "creator@restaurant.local",
          "emailVerified": true,
          "firstName": "Menu",
          "lastName": "Creator",
          "credentials": [
            {
              "type": "password",
              "value": "creator",
              "temporary": false
            }
          ],
          "realmRoles": ["menu-creator"]
        }
      ]
    }
