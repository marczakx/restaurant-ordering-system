# Nginx reverse-proxy tier (the entry point).
#
# Pure proxy: forwards / to the Angular SPA service and proxies
# /api, /ws, /oauth2 to the backend and /keycloak to Keycloak.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-nginx
  namespace: restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-nginx
  template:
    metadata:
      labels:
        app: restaurant-nginx
    spec:
      containers:
      - name: nginx
        image: marczakx/restaurant-nginx:937a25d3
        imagePullPolicy: Always
        ports:
        - containerPort: 80