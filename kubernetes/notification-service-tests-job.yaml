# Run notification-service unit tests as a Kubernetes Job.
#
# Run the matching image build first:
#   docker build -t restaurant-notification-service-tests:local \
#     -f kubernetes/notification-service-tests.Dockerfile .
#   minikube image load restaurant-notification-service-tests:local
#
# Apply / observe:
#   kubectl --context <ctx> -n restaurant delete job notification-service-tests --ignore-not-found=true
#   kubectl --context <ctx> -n restaurant apply -f kubernetes/notification-service-tests-job.yaml
#   kubectl --context <ctx> -n restaurant wait --for=condition=complete --timeout=10m job/notification-service-tests
#   kubectl --context <ctx> -n restaurant logs job/notification-service-tests
apiVersion: batch/v1
kind: Job
metadata:
  name: notification-service-tests
  namespace: restaurant
  labels:
    app: restaurant-notification-service-tests
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: restaurant-notification-service-tests
    spec:
      restartPolicy: Never
      containers:
        - name: tests
          image: marczakx/restaurant-notification-service-tests:1.0.3-6b0f7e3d
          imagePullPolicy: Always
          command: ["mvn", "-B", "test"]
          workingDir: /src
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
