spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:restaurant;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data-postgresql.sql resyncs ID sequences after seeding rows with explicit ids
spring.sql.init.data-locations=classpath:data.sql,classpath:data-postgresql.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# OAuth2 Configuration
# Placeholders keep the application startable without real credentials;
# set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET to enable the actual Google flow.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Kafka - the backend publishes order events to the "order-events" topic;
# the notification service consumes them and broadcasts them to the frontend
# over WebSocket. The backend is producer-only, so only producer settings and
# the topic name are configured here.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.topic.order-events=order-events

# Keycloak token introspection (RFC 7662)
# The backend exposes /internal/auth/verify which is called by the nginx
# auth_request directive. That endpoint forwards the bearer token to
# Keycloak's token introspection endpoint using these client credentials.
# The default URL points to the Keycloak instance defined in
# docker-compose.yml; override at runtime for other environments.
keycloak.introspection.url=${KEYCLOAK_INTROSPECTION_URL:http://keycloak:8080/realms/restaurant/protocol/openid-connect/token/introspect}
keycloak.introspection.client-id=${KEYCLOAK_INTROSPECTION_CLIENT_ID:restaurant-backend}
keycloak.introspection.client-secret=${KEYCLOAK_INTROSPECTION_CLIENT_SECRET:restaurant-backend-secret}
keycloak.introspection.connect-timeout-ms=${KEYCLOAK_INTROSPECTION_CONNECT_TIMEOUT_MS:2000}
keycloak.introspection.read-timeout-ms=${KEYCLOAK_INTROSPECTION_READ_TIMEOUT_MS:2000}
