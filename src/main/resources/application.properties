spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:restaurant;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data-postgresql.sql resyncs ID sequences after seeding rows with explicit ids
spring.sql.init.data-locations=classpath:data.sql,classpath:data-postgresql.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# OAuth2 Configuration
# Placeholders keep the application startable without real credentials;
# set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET to enable the actual Google flow.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Kafka - the backend publishes order events to the "order-events" topic;
# the notification service consumes them and broadcasts them to the frontend
# over WebSocket. The backend is producer-only, so only producer settings and
# the topic name are configured here.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.topic.order-events=order-events

# Note: the Keycloak token-introspection endpoint and its credentials have
# moved to the standalone auth-service module. See /auth-service for the
# current configuration.

