spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:restaurant;MODE=PostgreSQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# data-postgresql.sql resyncs ID sequences after seeding rows with explicit ids
spring.sql.init.data-locations=classpath:data.sql,classpath:data-postgresql.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
