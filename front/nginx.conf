events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # The /ws location sets $auth_header from ?access_token=... because
    # browsers cannot set custom headers on the WebSocket handshake. The
    # auth_request subrequest inherits variables from the parent request,
    # so this map picks up $auth_header when present and falls back to the
    # original Authorization header for regular API calls.
    map $auth_header $effective_auth_header {
        default $http_authorization;
        "~.+" $auth_header;
    }

    server {
        listen       80;
        server_name  localhost;

        # ---- Auth helpers -------------------------------------------------------
        #
        # Both the API and the WebSocket are protected by the same auth_request
        # subrequest that delegates to the standalone auth-service
        # (POST/GET /internal/verify). The subrequest returns:
        #   - 200 + X-User / X-User-Id / X-Roles when the bearer token is valid
        #     and (for the admin endpoints) the user holds the required role;
        #   - 401 when the token is missing or invalid;
        #   - 403 when the token is valid but the user lacks the required role.
        # nginx copies the response headers with auth_request_set so the upstream
        # application (backend / notification-service) can see who the user is.
        #
        # The internal named locations for the subrequest and the error
        # fallbacks live inside the same server block so they share the
        # same error_page / auth_request context. Putting them at the
        # http level would be invalid (location directives are not
        # allowed in the http context).

        # Subrequest for "any logged-in user". Called from /api and /ws.
        location = /_auth_verify {
            internal;                       # not reachable from the outside
            proxy_pass http://auth-service:8084/internal/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # Pass the bearer token to the auth-service. Regular API calls
            # carry it in the Authorization header; WebSocket connections
            # cannot set custom headers from the browser, so the SPA sends
            # the token in ?access_token=... instead. The /ws location
            # rewrites it into $auth_header, which the map above turns into
            # the effective Authorization header for this subrequest.
            proxy_set_header Authorization $effective_auth_header;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Subrequest for "user must have the 'admin' role" (or 'superadmin',
        # which the auth-service treats as a superset of every required role).
        location = /_auth_verify_admin {
            internal;
            proxy_pass http://auth-service:8084/internal/verify?required=admin;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $effective_auth_header;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Error fallbacks ---------------------------------------------------

        # When the auth_request subrequest returns 401 (token missing or invalid)
        # the SPA is expected to react on its side; for the API and WebSocket
        # we just return 401 to the client so XHR / EventSource / WebSocket
        # callers see a clear error.
        error_page 401 = @unauthorized;
        location @unauthorized {
            return 401 "unauthorized\n";
        }

        # 403 means the user is logged in but lacks the required role – most
        # often because a non-admin tried to open the Keycloak admin UI.
        error_page 403 = @forbidden;
        location @forbidden {
            return 403 "forbidden\n";
        }

        # The SPA is served by the separate Angular image; everything that is
        # not a proxied API path falls through to it. `serve -s` on the
        # Angular side provides the index.html fallback for client routes.
        location / {
            proxy_pass http://angular:4200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Keycloak so the SPA can use a relative /keycloak URL
        # (works the same in Docker Compose and Kubernetes).
        #
        # IMPORTANT: the OIDC endpoints (token, login, userinfo, etc.) MUST
        # be reachable without an existing session – that is how the SPA
        # obtains the bearer token in the first place. Only the Keycloak
        # admin console is restricted to admin/superadmin via auth_request;
        # any other /keycloak/ path is proxied through.
        location /keycloak/ {
            proxy_pass http://keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak admin console – restricted to admin and superadmin via
        # auth_request (see /_auth_verify_admin above). Declared *after* the
        # catch-all /keycloak/ location so the prefix match wins for normal
        # OIDC endpoints, while the exact /keycloak/admin path is overridden
        # by this more specific block.
        location = /keycloak/admin {
            auth_request /_auth_verify_admin;
            auth_request_set $auth_user   $upstream_http_x_user;
            auth_request_set $auth_userid $upstream_http_x_user_id;
            auth_request_set $auth_roles  $upstream_http_x_roles;

            proxy_pass http://keycloak:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User    $auth_user;
            proxy_set_header X-User-Id $auth_userid;
            proxy_set_header X-Roles   $auth_roles;
        }
        location /keycloak/admin/ {
            auth_request /_auth_verify_admin;
            auth_request_set $auth_user   $upstream_http_x_user;
            auth_request_set $auth_userid $upstream_http_x_user_id;
            auth_request_set $auth_roles  $upstream_http_x_roles;

            proxy_pass http://keycloak:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User    $auth_user;
            proxy_set_header X-User-Id $auth_userid;
            proxy_set_header X-Roles   $auth_roles;
        }

        # WebSocket/STOMP endpoint. The STOMP broker lives in the
        # notification-service (port 8083) – the backend only publishes
        # to Kafka and does not expose a WebSocket endpoint, so routing
        # /ws to the backend would always fail the upgrade.
        #
        # SockJS (used by the Angular client) does not let JS code set
        # custom headers on the WebSocket handshake. Instead the token is
        # sent as ?access_token=... in the URL. We rewrite it into an
        # Authorization header before the auth_request subrequest runs.
        location /ws {
            if ($arg_access_token) {
                set $auth_header "Bearer $arg_access_token";
            }
            proxy_set_header Authorization $auth_header;

            auth_request /_auth_verify;
            auth_request_set $auth_user   $upstream_http_x_user;
            auth_request_set $auth_userid $upstream_http_x_user_id;
            auth_request_set $auth_roles  $upstream_http_x_roles;

            proxy_pass http://notification-service:8083/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User    $auth_user;
            proxy_set_header X-User-Id $auth_userid;
            proxy_set_header X-Roles   $auth_roles;
        }

        # Proxy the Spring Security OAuth2 endpoints so the Google login flow
        # started from the SPA works through the same origin.
        # $http_host (unlike $host) preserves the port the browser used,
        # so absolute redirects built by Spring Security point back to
        # this server instead of dropping the port (e.g. :8082).
        location /oauth2/ {
            proxy_pass http://backend:8080/oauth2/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exact match only: /login itself is an Angular SPA route and must
        # keep being served by index.html (a prefix /login/ here would break
        # it with a directory redirect into the backend).
        location = /login/oauth2/code/google {
            proxy_pass http://backend:8080/login/oauth2/code/google;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Authentication endpoints (start the Google OAuth2 flow and report
        # the session status) MUST be reachable without a bearer token –
        # they are part of the login flow itself. The backend permits these
        # paths anonymously; a longer prefix match wins over /api/ below.
        location /api/auth/ {
            proxy_pass http://backend:8080/api/auth/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # REST API. Every request must carry a valid Keycloak bearer token;
        # the auth-service validates it and forwards the user identity to
        # the backend via X-User / X-User-Id / X-Roles headers.
        location /api/ {
            auth_request /_auth_verify;
            auth_request_set $auth_user   $upstream_http_x_user;
            auth_request_set $auth_userid $upstream_http_x_user_id;
            auth_request_set $auth_roles  $upstream_http_x_roles;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Credentials' 'true';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'accesstoken, authorization, Content-Type';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-User    $auth_user;
            proxy_set_header X-User-Id $auth_userid;
            proxy_set_header X-Roles   $auth_roles;
        }
    }
}
